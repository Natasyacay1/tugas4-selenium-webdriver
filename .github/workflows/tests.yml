name: Selenium Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v -n 2 --reruns 2 --html=report.html --self-contained-html
        env:
          HEADLESS: "1"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: report.html
